name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # โปรเจกต์ไม่มี gradlew -> ระบุ Gradle เอง (AGP 8.7.3 ต้อง Gradle >= 8.9)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # ติดตั้ง cmdline-tools + ตั้ง ANDROID_HOME / PATH ให้ sdkmanager ใช้ได้
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK, NDK, CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # หาโฟลเดอร์ที่มี settings.gradle.kts (รองรับกรณีโปรเจกต์อยู่ในโฟลเดอร์ย่อยของ repo)
      - name: Locate Gradle project
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name 'settings.gradle*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::ไม่พบ settings.gradle(.kts) ใน repo - ไฟล์ root ของโปรเจกต์ (settings.gradle.kts, build.gradle.kts, gradle.properties) ยังไม่ได้ถูกอัปโหลด"
            ls -la
            exit 1
          fi
          d=$(dirname "$f")
          echo "Gradle project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      # ตรวจว่าโมดูล app ครบ (ถ้าขาด Gradle จะฟ้องแค่ว่าไม่เจอ task assembleDebug)
      - name: Show repo layout
        run: |
          echo "== top level =="; ls -la
          echo "== tracked files (first 60, no res/cpp) =="
          git ls-files | grep -v -E "/res/|/cpp/shared|/cpp/dis" | head -60
          echo "== gradle files anywhere =="
          find . -maxdepth 4 \( -name "build.gradle*" -o -name "settings.gradle*" -o -name "AndroidManifest.xml" \) -not -path "./.git/*"

      - name: Check app module
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          ls -la . app || true
          if [ ! -f app/build.gradle.kts ] || ! grep -q "com.android.application" app/build.gradle.kts; then
            echo "::error::app/build.gradle.kts หายหรือไม่มี plugin com.android.application - อัปโหลดไฟล์นี้ขึ้น repo"
            exit 1
          fi
          test -f app/src/main/AndroidManifest.xml || { echo "::error::ไม่พบ app/src/main/AndroidManifest.xml"; exit 1; }

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fluxa-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
